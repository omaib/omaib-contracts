# This workflow will generate a log of changes automatically upon a new release.
# See https://github.com/marketplace/actions/changelog-ci

name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  log-changes:
    name: Log changes
    # Fork PRs cannot push a commit back to the head branch; skip for forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Kept as a safety net even though we now use a patched image (below):
    # GitHub Actions doesn't apply step-level continue-on-error to failures
    # during a container action's *image build* (only to failures during its
    # execution), so this needs to stay at job level to be effective at all.
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          # Keep checkout shallow; changelog-ci handles unshallow internally.
          # Using fetch-depth: 0 causes changelog-ci to fail with:
          # "fatal: --unshallow on a complete repository does not make sense"
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run changelog
        # Using our fork (omaib/changelog-ci), not upstream saadmk11/changelog-ci@v1.2.0:
        # upstream's bundled Docker image is pinned to python:3.12-slim-bullseye (Debian 11),
        # whose security-archive packages have been pruned from deb.debian.org, breaking the
        # action's own image build (apt-get install git fails, exit code 100). No upstream
        # release fixes this yet. Our fork bumps the base image to bookworm; verified with a
        # local build that it builds clean and git installs correctly inside the container.
        uses: omaib/changelog-ci@v1.2.0-bookworm
        with:
          changelog_filename: CHANGELOG.md
          config_file: .github/changelog-ci-config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
