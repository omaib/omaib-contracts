# This workflow will generate a log of changes automatically upon a new release.
# See https://github.com/marketplace/actions/changelog-ci

name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  log-changes:
    name: Log changes
    # Fork PRs cannot push a commit back to the head branch; skip for forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Job-level (not step-level) continue-on-error: saadmk11/changelog-ci's
    # bundled Docker image is pinned to python:3.12-slim-bullseye (Debian 11),
    # whose security-archive packages get pruned from deb.debian.org over
    # time, breaking `apt-get install` inside the action's own image build.
    # GitHub Actions does not apply step-level continue-on-error to failures
    # that occur while *building* a container action's image (only to
    # failures during its execution), so this optional, non-blocking check
    # was still reported as failed. Job-level continue-on-error is
    # unaffected by that limitation.
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          # Keep checkout shallow; changelog-ci handles unshallow internally.
          # Using fetch-depth: 0 causes changelog-ci to fail with:
          # "fatal: --unshallow on a complete repository does not make sense"
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run changelog
        uses: saadmk11/changelog-ci@v1.2.0
        with:
          changelog_filename: CHANGELOG.md
          config_file: .github/changelog-ci-config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
