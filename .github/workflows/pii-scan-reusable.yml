name: PII Scan (reusable)
# -----------------------------------------------------------------------
# Reusable workflow — hosted in omaib-contracts, called by every repo in
# the omaib GitHub organisation.
#
# Caller syntax (minimal, paste into any omaib repo's workflow):
#
#   jobs:
#     pii-scan:
#       uses: omaib/omaib-contracts/.github/workflows/pii-scan-reusable.yml@develop
#
# The workflow checks out the *calling* repo, downloads the scanner from
# omaib-contracts, then runs it against the calling repo's working tree.
#
# omaib-contracts is a public repo, so no auth is needed to fetch
# pii_scan.py — `contracts_token` is accepted (and ignored) only so
# existing callers that still pass it don't break.
# -----------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for the scanner"
        required: false
        type: string
        default: "3.12"
    secrets:
      contracts_token:
        description: >-
          Unused. omaib-contracts is public, so pii_scan.py is fetched
          without authentication. Kept optional so existing callers that
          still pass this secret continue to work unchanged.
        required: false

jobs:
  pii-scan:
    name: PII compliance scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Download pii_scan.py from omaib-contracts
        # No auth header: omaib-contracts is public. An empty or invalid
        # token here is *worse* than no token — raw.githubusercontent.com
        # returns 404 (not 401/403) for any bad Authorization header, even
        # on a public repo, which is what broke this download previously.
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/omaib/omaib-contracts/develop/scripts/pii_scan.py" \
            -o pii_scan_tool.py

      - name: Run PII scan
        # Pass '.' so the scanner treats the checkout root as the repo root,
        # regardless of the script's own location.
        run: python pii_scan_tool.py .
